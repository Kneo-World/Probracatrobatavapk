name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # Используем Capacitor, чтобы превратить HTML в APK
      - name: Build with Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          # Указываем папку www вместо точки
          npx cap init Probracat "com.kneo.probra" --web-dir www
          npx cap add android
          # Создаем пустую папку assets, чтобы Gradle не ругался
          mkdir -p android/app/src/main/assets
          npx cap sync
          cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Probra-Game
          path: android/app/build/outputs/apk/debug/app-debug.apk
