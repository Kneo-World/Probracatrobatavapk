name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v3
        with: { node-version: '20' }
      - uses: actions/setup-java@v3
        with: { distribution: 'temurin', java-version: '21' }

      - name: Accept licenses & install SDK components
        run: |
          yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Ensure www/index.html exists
        run: if [ ! -f www/index.html ]; then echo "ERROR: www/index.html not found"; exit 1; fi

      - name: Capacitor init & sync
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.kneo.probra",
            "appName": "Probracat",
            "webDir": "www",
            "android": {
              "minSdkVersion": 22,
              "compileSdkVersion": 34,
              "targetSdkVersion": 34,
              "allowMixedContent": true,
              "webContentsDebuggingEnabled": true
            },
            "server": { "androidScheme": "http" }
          }
          EOF
          npx cap add android
          npx cap sync android

          # Важное исправление конфликта Kotlin
          cat <<'GRADLE' >> android/app/build.gradle
          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }
          GRADLE

      - name: Diagnostics – list assets
        run: find android/app/src/main/assets -type f || echo "No assets!"

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Probra-Game
          path: android/app/build/outputs/apk/debug/app-debug.apk
