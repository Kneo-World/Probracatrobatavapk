name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          # Ставим 17-ю, она стабильнее для Capacitor
          java-version: '17'

      - name: Prepare Folder and Build
        run: |
          # Создаем временную папку www для сборщика
          mkdir -p www
          # Копируем туда всё: html, js и твою папку с фото
          cp index.html www/ 2>/dev/null || true
          cp script.js www/ 2>/dev/null || true
          cp -r images www/ 2>/dev/null || true
          
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init Probracat "com.kneo.probra" --web-dir www
          npx cap add android
          mkdir -p android/app/src/main/assets
          npx cap sync
          cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Probra-Game
          path: android/app/build/outputs/apk/debug/app-debug.apk
