name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd $ANDROID_SDK_ROOT/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-*.zip
          mkdir -p latest
          mv cmdline-tools/* latest/ 2>/dev/null || true
          cd latest/bin
          yes | ./sdkmanager --sdk_root=$ANDROID_SDK_ROOT --licenses > /dev/null 2>&1
          ./sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1

      - name: Ensure index.html exists
        run: |
          if [ ! -f index.html ]; then
            echo "ERROR: index.html not found in repository root"
            exit 1
          fi

      - name: Prepare web assets and Capacitor
        run: |
          mkdir -p www
          cp index.html www/
          cp script.js www/ 2>/dev/null || true
          cp -r images www/ 2>/dev/null || true

          npm install @capacitor/core @capacitor/cli @capacitor/android

          cat <<EOF > capacitor.config.json
          {
            "appId": "com.kneo.probra",
            "appName": "Probracat",
            "webDir": "www",
            "android": {
              "minSdkVersion": 22,
              "compileSdkVersion": 34,
              "targetSdkVersion": 34,
              "allowMixedContent": true,
              "captureInput": false,
              "webContentsDebuggingEnabled": true
            },
            "server": {
              "androidScheme": "http"
            }
          }
          EOF

          npx cap add android
          npx cap sync android

      - name: List assets (diagnostic)
        run: |
          echo "====== content of assets ======"
          find android/app/src/main/assets -type f || echo "no assets found!"
          echo "==============================="

      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Probra-Game
          path: android/app/build/outputs/apk/debug/app-debug.apk
