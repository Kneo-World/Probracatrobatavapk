name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Prepare web assets and Capacitor
        run: |
          # 1. Собрать статику в папку www
          mkdir -p www
          cp index.html www/ 2>/dev/null || true
          cp script.js www/ 2>/dev/null || true
          cp -r images www/ 2>/dev/null || true

          # 2. Установить Capacitor
          npm install @capacitor/core @capacitor/cli @capacitor/android

          # 3. Создать конфигурацию Capacitor (заменили ручной init)
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.kneo.probra",
            "appName": "Probracat",
            "webDir": "www",
            "android": {
              "minSdkVersion": 22,
              "compileSdkVersion": 35,
              "targetSdkVersion": 35
            }
          }
          EOF

          # 4. Добавить платформу Android
          npx cap add android

          # 5. Синхронизировать (даёт гарантию, что web/assets на месте)
          npx cap sync android

      - name: Build Android APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Probra-Game
          path: android/app/build/outputs/apk/debug/app-debug.apk
