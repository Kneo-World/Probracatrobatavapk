name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17' # Вернем 17, она стабильнее с этим фиксом

      - name: Prepare and Build
        run: |
          mkdir -p www
          cp index.html www/ 2>/dev/null || true
          cp script.js www/ 2>/dev/null || true
          cp -r images www/ 2>/dev/null || true
          
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init Probracat "com.kneo.probra" --web-dir www
          npx cap add android
          
          # ФИКС ДУБЛИКАТОВ: разрешаем Gradle сливать файлы с одинаковыми именами
          echo "android {
              packagingOptions {
                  pickFirst 'META-INF/kotlin-stdlib.kotlin_module'
                  pickFirst 'META-INF/kotlin-stdlib-common.kotlin_module'
                  pickFirst 'META-INF/library_release.kotlin_module'
              }
          }" >> android/app/build.gradle

          npx cap sync
          cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Probra-Game
          path: android/app/build/outputs/apk/debug/app-debug.apk
