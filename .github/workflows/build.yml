name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Prepare and Build
        run: |
          mkdir -p www
          cp index.html www/ 2>/dev/null || true
          cp script.js www/ 2>/dev/null || true
          cp -r images www/ 2>/dev/null || true
          
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init Probracat "com.kneo.probra" --web-dir www
          npx cap add android
          
          # ПРИНУДИТЕЛЬНАЯ ПЕРЕЗАПИСЬ КОНФИГА (Чиним дубликаты из лога)
          cat <<EOF > android/app/build.gradle
          apply plugin: 'com.android.application'
          android {
              namespace "com.kneo.probra"
              compileSdk 34
              defaultConfig {
                  applicationId "com.kneo.probra"
                  minSdk 22
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              packagingOptions {
                  resources {
                      excludes += ['/META-INF/{AL2.0,LGPL2.1}', '**/kotlin-stdlib.kotlin_module', '**/kotlin-stdlib-common.kotlin_module', '**/library_release.kotlin_module']
                  }
              }
          }
          dependencies {
              implementation fileTree(include: ['*.jar'], dir: 'libs')
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation project(':capacitor-android')
          }
          EOF

          npx cap sync
          cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Probra-Game
          path: android/app/build/outputs/apk/debug/app-debug.apk
