name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk   # совпадает с ANDROID_HOME
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'               # <-- Возвращаем Java 21

      - name: Accept Android SDK licenses & install tools
        run: |
          yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Ensure www/index.html exists
        run: |
          if [ ! -f www/index.html ]; then
            echo "ERROR: www/index.html not found"
            exit 1
          fi

      - name: Initialize Capacitor and sync
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

          cat <<EOF > capacitor.config.json
          {
            "appId": "com.kneo.probra",
            "appName": "Probracat",
            "webDir": "www",
            "android": {
              "minSdkVersion": 22,
              "compileSdkVersion": 34,
              "targetSdkVersion": 34,
              "allowMixedContent": true,
              "webContentsDebuggingEnabled": true
            },
            "server": {
              "androidScheme": "http"
            }
          }
          EOF

          npx cap add android
          npx cap sync android

      - name: List assets (diagnostic)
        run: |
          echo "====== content of assets ======"
          find android/app/src/main/assets -type f || echo "no assets found!"
          echo "==============================="

      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Probra-Game
          path: android/app/build/outputs/apk/debug/app-debug.apk
