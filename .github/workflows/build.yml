name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Prepare and Build
        run: |
          # 1. Готовим папку www
          mkdir -p www
          cp index.html www/ 2>/dev/null || true
          cp script.js www/ 2>/dev/null || true
          cp -r images www/ 2>/dev/null || true
          
          # 2. Ставим Capacitor
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init Probracat "com.kneo.probra" --web-dir www
          npx cap add android
          
          # 3. ФИКС ДУБЛИКАТОВ (как на скрине image_e4bf71.jpg)
          echo "configurations.all {
              resolutionStrategy.eachDependency { DependencyResolveDetails details ->
                  if (details.requested.group == 'org.jetbrains.kotlin') {
                      details.useVersion '1.9.10'
                  }
              }
          }" >> android/build.gradle

          # 4. Сборка
          npx cap sync
          cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Probra-Game
          path: android/app/build/outputs/apk/debug/app-debug.apk
