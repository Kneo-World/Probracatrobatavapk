name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v3
        with:
          node-version: 20

      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept licenses & install required Android SDK packages
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare web assets and Capacitor
        run: |
          mkdir -p www
          cp index.html www/ 2>/dev/null || true
          cp script.js www/ 2>/dev/null || true
          cp -r images www/ 2>/dev/null || true

          npm install @capacitor/core @capacitor/cli @capacitor/android

          cat <<EOF > capacitor.config.json
          {
            "appId": "com.kneo.probra",
            "appName": "Probracat",
            "webDir": "www",
            "android": {
              "minSdkVersion": 22,
              "compileSdkVersion": 35,
              "targetSdkVersion": 35
            }
          }
          EOF

          npx cap add android
          npx cap sync android

      - name: Fix Kotlin duplicate classes
        run: |
          cat <<'GRADLE_EOF' >> android/app/build.gradle
          configurations {
              all {
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              }
          }
          GRADLE_EOF

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Probra-Game
          path: android/app/build/outputs/apk/debug/app-debug.apk
