name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Prepare and Fix Project
        run: |
          # 1. Готовим папку www (как и раньше)
          mkdir -p www
          cp index.html www/ 2>/dev/null || true
          cp script.js www/ 2>/dev/null || true
          cp -r images www/ 2>/dev/null || true
          
          # 2. Инициализируем Capacitor
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init Probracat "com.kneo.probra" --web-dir www
          npx cap add android
          
          # 3. ХАК: Меняем Java 21 на 17 в конфигах проекта, чтобы не было ошибки
          find android -name "build.gradle" -exec sed -i 's/JavaVersion.VERSION_21/JavaVersion.VERSION_17/g' {} +
          find android -name "build.gradle" -exec sed -i 's/targetCompatibility = 21/targetCompatibility = 17/g' {} +
          find android -name "build.gradle" -exec sed -i 's/sourceCompatibility = 21/sourceCompatibility = 17/g' {} +

          # 4. Синхроним и собираем
          npx cap sync
          cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Probra-Game
          path: android/app/build/outputs/apk/debug/app-debug.apk
