<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background: white; color: black; font-size: 20px; padding: 20px; }
    </style>
</head>
<body>
    <h1>Тест загрузки HTML</h1>
    <p>Если вы это видите, Capacitor и WebView работают.</p>
    <script>
        // Минимальная проверка JavaScript
        document.body.innerHTML += '<p style="color:green;">JavaScript выполняется!</p>';
        
        // Попробуем нарисовать на canvas
        var c = document.createElement('canvas');
        c.width = 300; c.height = 300;
        document.body.appendChild(c);
        var ctx = c.getContext('2d');
        ctx.fillStyle = 'red';
        ctx.fillRect(10,10,100,100);
    </script>
</body>
</html>
